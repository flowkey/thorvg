name: Clang Format

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          curl -L https://raw.githubusercontent.com/llvm/llvm-project/release/18.x/clang/tools/clang-format/clang-format-diff.py -o /usr/local/bin/clang-format-diff
          chmod +x /usr/local/bin/clang-format-diff

      - name: Install reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0

      - name: Run clang-format check
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff -U0 ${{ github.event.pull_request.base.sha }} \
          | clang-format-diff -p1 \
          | reviewdog -f=diff \
                      -reporter=github-pr-check \
                      -filter-mode=added \
                      -fail-level=error